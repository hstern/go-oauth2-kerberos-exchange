# Minimal krb5.conf for offline GSSAPI acceptance (no KDC contact needed —
# the acceptor decrypts the ticket with the keytab). Used via $KRB5_CONFIG.
[libdefaults]
    default_realm = EXAMPLE.COM
    dns_lookup_kdc = false
    dns_lookup_realm = false
    permitted_enctypes = aes256-cts-hmac-sha1-96

[realms]
    EXAMPLE.COM = {
    }
